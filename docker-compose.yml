services:
  price-agent:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./assets:/app/assets
      - ./.env:/app/.env
    shm_size: "256m"
    restart: unless-stopped

  batch-price-agent:
    build: ./batch-price-agent
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      PRICE_AGENT_PATH: /app/GepcoopPriceAgent
      EUR_TO_HUF_RATE: "400"
      BATCH_MAX_ITEMS: "50"
      BATCH_SUPPLIER_LIMIT: "4"
      SCRAPER_TIMEOUT_SECONDS: "60"
      SCRAPER_RETRY_COUNT: "2"
    volumes:
      # A price agent kódja csak olvasható — a batch nem módosíthatja.
      - .:/app/GepcoopPriceAgent:ro
      # A Vipa (és többi) session könyvtár viszont közös és írható, hogy a batch
      # UI-ból indított OTP belépés is el tudja menteni a sessiont. Ugyanazt a
      # host-mappát (./assets/sessions) használja, amit a price agent ír.
      - ./assets/sessions:/app/GepcoopPriceAgent/assets/sessions
    shm_size: "256m"
    restart: unless-stopped
